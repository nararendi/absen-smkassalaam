<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2d5c"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <!-- Pencil Body Gradient (Golden Amber) -->
    <linearGradient id="pencilBody" x1="50" y1="50" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pencil Highlight -->
    <linearGradient id="pencilHighlight" x1="60" y1="40" x2="120" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Wood Tip Gradient -->
    <linearGradient id="woodTip" x1="35" y1="125" x2="65" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <rect x="2" y="2" width="176" height="176" rx="40" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>

  <!-- Inner Subtle Accent Circle -->
  <circle cx="90" cy="90" r="72" fill="white" fill-opacity="0.04"/>

  <!-- Ballpoint / Pencil Graphic -->
  <g filter="url(#glow)">
    <!-- Main Pencil Barrel (Diagonal from top-right to bottom-left) -->
    <!-- Top Eraser & Ferrule -->
    <path d="M124 32 C129 27, 137 27, 142 32 L148 38 C153 43, 153 51, 148 56 L136 68 L112 44 Z" fill="#f43f5e"/>
    <path d="M112 44 L136 68 L127 77 L103 53 Z" fill="#cbd5e1"/>
    <line x1="108" y1="49" x2="132" y2="73" stroke="#94a3b8" stroke-width="2"/>

    <!-- Pencil Body (Faceted 3D effect) -->
    <path d="M103 53 L127 77 L69 135 L45 111 Z" fill="url(#pencilBody)"/>
    <path d="M103 53 L115 65 L57 123 L45 111 Z" fill="url(#pencilHighlight)"/>

    <!-- Wood Cone Tip -->
    <path d="M45 111 L69 135 L33 147 Z" fill="url(#woodTip)"/>

    <!-- Graphite / Pen Nib -->
    <path d="M33 147 L41 144 L36 139 Z" fill="#1e293b"/>
    <polygon points="33,147 42,144 36,138" fill="#0f172a"/>

    <!-- Checkmark / Ink Swirl underneath representing Attendance Marking -->
    <path d="M30 152 Q55 145 75 154 T125 142" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M110 132 L124 144 L152 114" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
